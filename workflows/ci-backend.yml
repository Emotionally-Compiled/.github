name: Backend CI Pipeline (Spring Boot)

on:
  workflow_call:

jobs:
  build-and-test:
    name: Compile and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: clone repository
        uses: actions/checkout@v4

      - name: config java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Grant execution permissions to Maven
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw clean test

      - name: Build packaged (JAR)
        run: ./mvnw clean package -DskipTests
